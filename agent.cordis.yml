# The `mini-win` agent preset: a Windows-friendly minimal coding-agent composition,
# derived from `minimal`. The original `minimal` mounts a persistent bash shell
# over the PTY backend, which is Linux/macOS-only and therefore unusable on this
# Windows host. This copy swaps the shell for the sandboxed one-shot PowerShell
# tool (`dsh-tool-pwsh`) plus an UNSANDBOXED native cmd.exe tool
# (`./cmd-tool.js`) spawned directly through `ctx.subprocess`. Everything else
# stays minimal.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model composes only
# `pwsh`, `cmd`, and `str_replace_editor`. Context compaction is absent.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# One-shot PowerShell execution, mirroring the `standard` preset's Windows
# shell. The executor (`pwsh-sandbox`/`pwsh-local`) and the `shell-env`
# registry are host-plane (provided by the `dsh-base` bundle), so this row
# only registers the model-facing tool.
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# Native Windows Command Prompt execution (cmd.exe) spawned directly through
# `ctx.subprocess` — deliberately UNSANDBOXED (it does not route through the
# host shell seam, so no file sandbox applies). The plugin is a preset-local
# file; its tool description instructs the agent to ask the user before
# calling, and to fall back to the sandboxed `pwsh` tool otherwise.
- id: tool-cmd
  name: ./cmd-tool.js
  disabled: !!js process.platform !== 'win32'

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# Mask the GitHub tools that the dsh-github-mcp bundle registers globally, so
# this minimal preset stays minimal (keeps pwsh / cmd / str_replace_editor only).
- id: restrict-github
  name: ./restrict-github.js
