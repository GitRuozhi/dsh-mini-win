# The `mini-win` agent preset: official `minimal`, with both persistent
# shells mounted (Git Bash + PowerShell 7) and the dsh-github-mcp tool
# family masked out.
#
# Official `minimal` mounts exactly one shell stack (`bash` on POSIX, `pwsh`
# on win32) under a shared PTY backend type `shell`. This preset keeps the
# same persona / no-compaction / no-runtime-context contract, then mounts
# two isolated shell stacks so both tools can coexist.
#
# Git Bash (MSYS) cannot start under the Windows ACL restricted-token runner,
# so the bash stack isolates `sandbox` and uses a passthrough confine. The
# pwsh stack keeps the host ACL sandbox.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

- id: persistent-bash-stack
  name: cordis:group
  group: true
  isolate:
    terminals: true
    sandbox: true
  config:
    - id: pty-bash
      name: '@deepseek-ai/dsh-terminal'

    - id: bash-sandbox-passthrough
      name: ./pty-unconfined-sandbox.mjs

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        backendType: bash
        shellDialect: bash
        timeoutMs: 300000
        shellPath: !!js (process.platform !== "win32" && "/bin/bash") || process.env.DSH_BASH_PATH || (process.env.ProgramFiles + "\\Git\\bin\\bash.exe")

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        backendType: bash
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

- id: persistent-pwsh-stack
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty-pwsh
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        backendType: pwsh
        shellDialect: pwsh
        timeoutMs: 300000
        shellPath: !!js process.env.DSH_PWSH_PATH || "pwsh"

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      config:
        backendType: pwsh
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell 7 (pwsh) shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell 7, not bash and not Windows PowerShell 5.1.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# Mask GitHub tools inherited from the host (dsh-github-mcp). A preset cannot
# unregister host rows; this row hides them for this preset's scope only.
- id: tool-deny-github
  name: ./block-github.mjs
